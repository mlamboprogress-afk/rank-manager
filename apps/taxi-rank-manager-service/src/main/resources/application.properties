# =============================================================================
# Taxi Rank Manager — application configuration
# =============================================================================

# Jandex — force Quarkus to index all project modules so CDI beans and
# JPA entities in the domain/adapter JARs are discovered at runtime.
quarkus.index-dependency.shared-kernel.group-id=za.co.taxirankmanager
quarkus.index-dependency.shared-kernel.artifact-id=shared-kernel
quarkus.index-dependency.identity.group-id=za.co.taxirankmanager
quarkus.index-dependency.identity.artifact-id=module-identity
quarkus.index-dependency.rank.group-id=za.co.taxirankmanager
quarkus.index-dependency.rank.artifact-id=module-rank
quarkus.index-dependency.fleet.group-id=za.co.taxirankmanager
quarkus.index-dependency.fleet.artifact-id=module-fleet
quarkus.index-dependency.route.group-id=za.co.taxirankmanager
quarkus.index-dependency.route.artifact-id=module-route
quarkus.index-dependency.queue.group-id=za.co.taxirankmanager
quarkus.index-dependency.queue.artifact-id=module-queue
quarkus.index-dependency.notification.group-id=za.co.taxirankmanager
quarkus.index-dependency.notification.artifact-id=module-notification
quarkus.index-dependency.rest.group-id=za.co.taxirankmanager
quarkus.index-dependency.rest.artifact-id=adapter-inbound-rest
quarkus.index-dependency.scheduler.group-id=za.co.taxirankmanager
quarkus.index-dependency.scheduler.artifact-id=adapter-inbound-scheduler
quarkus.index-dependency.postgres.group-id=za.co.taxirankmanager
quarkus.index-dependency.postgres.artifact-id=adapter-outbound-postgres
quarkus.index-dependency.sms.group-id=za.co.taxirankmanager
quarkus.index-dependency.sms.artifact-id=adapter-outbound-sms
quarkus.index-dependency.security.group-id=za.co.taxirankmanager
quarkus.index-dependency.security.artifact-id=adapter-outbound-security
quarkus.index-dependency.clock.group-id=za.co.taxirankmanager
quarkus.index-dependency.clock.artifact-id=adapter-outbound-clock

# =============================================================================
# Database — dev profile uses Quarkus Dev Services (auto-starts a container).
#            prod profile uses explicit connection details from env vars.
# =============================================================================
quarkus.datasource.db-kind=postgresql

# Dev — no explicit JDBC URL so Dev Services auto-starts a PostgreSQL container.
# Requires Docker Desktop to be running.
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.db-name=taxi_rank_manager_dev
%dev.quarkus.datasource.devservices.username=dev
%dev.quarkus.datasource.devservices.password=dev

# Local — point at a manually started PostgreSQL (docker-compose or native install).
# Activate with: -Dquarkus.profile=local
%local.quarkus.datasource.username=${DB_USERNAME:taxi_rank_manager}
%local.quarkus.datasource.password=${DB_PASSWORD:changeme}
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taxi_rank_manager}

# Prod
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Hibernate — no auto-schema generation; Flyway owns the schema
quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.log.sql=true
%local.quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.sql=false

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173

# OIDC — configure for your identity provider before go-live
# quarkus.oidc.auth-server-url=https://your-auth-server/realms/your-realm
# quarkus.oidc.client-id=taxi-rank-manager
quarkus.oidc.enabled=false

# Security — disable proactive auth so unauthenticated health checks work
quarkus.http.auth.proactive=false

# OpenAPI
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."za.co.taxirankmanager".level=DEBUG

# Dev mode banner
quarkus.banner.path=banner.txt
